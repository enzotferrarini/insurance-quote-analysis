name: Reproduce insurance analytics
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m src.pipeline --output build/demo
      - run: python -m src.analyze --data build/demo --output build/reports
      - uses: actions/upload-artifact@v4
        with:
          name: insurance-analytics-demo
          path: |
            build/reports/
            build/demo/processed/
            build/demo/manifest.json
